name: Deploy to Cloud Run

on:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth con Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/931735187757/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@vitrinadeproductos.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vitrina-mercadona
          region: us-central1
          source: .
          flags: '--allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=0 --max-instances=1'
